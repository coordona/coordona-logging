[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coordona-logging"
version = "0.1.0"
description = "Batched session/function logging client for Coordona integration projects"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
console = ["tabulate"]

[tool.setuptools.packages.find]
where = ["src"]